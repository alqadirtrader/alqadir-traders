<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ledger System Fixed</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background-color: #f4f6f9; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, button { width: 100%; padding: 8px; box-sizing: border-box; margin-bottom: 10px; }
        button { background-color: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; }
        button:hover { background-color: #0056b3; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; text-align: center; }
        th, td { border: 1px solid #ddd; padding: 8px; }
        th { background-color: #343a40; color: white; }
        .summary-card { display: flex; justify-content: space-between; margin-top: 20px; gap: 10px; }
        .card { flex: 1; padding: 15px; background: #e9ecef; border-radius: 5px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h2>شاپ لیجر اینڈ کیش بک (Fixed Version)</h2>
    
    <div class="form-group">
        <label>CSV فائل اپ لوڈ کریں:</label>
        <input type="file" id="csvFile" accept=".csv">
    </div>

    <div class="form-group" style="display: flex; gap: 10px;">
        <div style="flex: 1;">
            <label>تاریخ سے (From Date):</label>
            <input type="date" id="fromDate" onchange="filterData()">
        </div>
        <div style="flex: 1;">
            <label>تاریخ تک (To Date):</label>
            <input type="date" id="toDate" onchange="filterData()">
        </div>
    </div>

    <div class="summary-card">
        <div class="card">
            <h4>سابقہ بقایا (Opening Balance)</h4>
            <h3 id="openingBalance">0</h3>
        </div>
        <div class="card">
            <h4>کل وصولی (Total Cash In)</h4>
            <h3 id="totalIn">0</h3>
        </div>
        <div class="card">
            <h4>کل ادائیگی (Total Cash Out)</h4>
            <h3 id="totalOut">0</h3>
        </div>
        <div class="card">
            <h4>موجودہ بقایا (Closing Balance)</h4>
            <h3 id="closingBalance">0</h3>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>تاریخ</th>
                <th>تفصیل</th>
                <th>وصولی (Jama)</th>
                <th>ادائیگی (Naam)</th>
                <th>رننگ بیلنس</th>
            </tr>
        </thead>
        <tbody id="ledgerTable">
            <!-- Data Rows will appear here -->
        </tbody>
    </table>
</div>

<script>
let globalTransactions = [];

// Date normalizer to standard YYYY-MM-DD
function parseStandardDate(dateStr) {
    if (!dateStr) return '';
    let cleanStr = dateStr.trim();
    if (cleanStr.includes('-')) {
        let parts = cleanStr.split('-');
        if (parts[0].length === 4) return cleanStr; // YYYY-MM-DD
        if (parts[2].length === 4) return `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`; // DD-MM-YYYY
    }
    if (cleanStr.includes('/')) {
        let parts = cleanStr.split('/');
        if (parts[2].length === 4) return `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`; // DD/MM/YYYY
    }
    return cleanStr;
}

document.getElementById('csvFile').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(event) {
        const text = event.target.result;
        processCSV(text);
    };
    reader.readAsText(file);
});

function processCSV(text) {
    const lines = text.split('\n');
    globalTransactions = [];

    for (let i = 1; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue;
        const cols = line.split(',');

        if (cols.length >= 4) {
            let normalizedDate = parseStandardDate(cols[0]);
            globalTransactions.push({
                date: normalizedDate,
                description: cols[1] ? cols[1].trim() : '',
                cashIn: parseFloat(cols[2]) || 0,
                cashOut: parseFloat(cols[3]) || 0
            });
        }
    }

    // Chronological Sort
    globalTransactions.sort((a, b) => a.date.localeCompare(b.date));
    filterData();
}

function filterData() {
    const fromDate = document.getElementById('fromDate').value;
    const toDate = document.getElementById('toDate').value;

    let openingBalance = 0;
    let periodIn = 0;
    let periodOut = 0;

    let tableBody = document.getElementById('ledgerTable');
    tableBody.innerHTML = '';

    // Calculate Opening Balance for dates strictly before fromDate
    if (fromDate) {
        globalTransactions.forEach(t => {
            if (t.date < fromDate) {
                openingBalance += (t.cashIn - t.cashOut);
            }
        });
    }

    let runningBalance = openingBalance;

    globalTransactions.forEach(t => {
        let include = true;
        if (fromDate && t.date < fromDate) include = false;
        if (toDate && t.date > toDate) include = false;

        if (include) {
            periodIn += t.cashIn;
            periodOut += t.cashOut;
            runningBalance += (t.cashIn - t.cashOut);

            let row = `<tr>
                <td>${t.date}</td>
                <td>${t.description}</td>
                <td style="color: green;">${t.cashIn}</td>
                <td style="color: red;">${t.cashOut}</td>
                <td><strong>${runningBalance}</strong></td>
            </tr>`;
            tableBody.innerHTML += row;
        }
    });

    document.getElementById('openingBalance').innerText = openingBalance;
    document.getElementById('totalIn').innerText = periodIn;
    document.getElementById('totalOut').innerText = periodOut;
    document.getElementById('closingBalance').innerText = runningBalance;
}
</script>

</body>
</html>
